<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Financial Mock Server ERD</title>
  <desc id="desc">ERD overview for user, CODEF source data, asset detail tables, fixtures, scenarios, and call logs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px Arial, sans-serif; fill: #172033; }
      .note { font: 400 14px Arial, sans-serif; fill: #64748b; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; rx: 8; }
      .core { fill: #eff6ff; stroke: #60a5fa; }
      .codef { fill: #f0fdf4; stroke: #4ade80; }
      .asset { fill: #fff7ed; stroke: #fb923c; }
      .fixture { fill: #fdf2f8; stroke: #f472b6; }
      .name { font: 700 14px Arial, sans-serif; fill: #111827; }
      .field { font: 400 12px Arial, sans-serif; fill: #4b5563; }
      .rel { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
      .label { font: 400 11px Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="48" y="52" class="title">Financial Mock Server ERD</text>
  <text x="48" y="78" class="note">CODEF source data and scenario-based response fixtures are separated for repeatable financial API testing.</text>

  <rect x="50" y="130" width="220" height="86" class="box core"/>
  <text x="70" y="162" class="name">mock_user</text>
  <text x="70" y="186" class="field">scenario_key, nickname</text>

  <rect x="350" y="130" width="240" height="94" class="box codef"/>
  <text x="370" y="162" class="name">mock_codef_connection</text>
  <text x="370" y="186" class="field">connected_id, status</text>
  <text x="370" y="206" class="field">last_synced_at</text>

  <rect x="690" y="130" width="240" height="94" class="box codef"/>
  <text x="710" y="162" class="name">mock_codef_institution</text>
  <text x="710" y="186" class="field">codef_org_code, name</text>
  <text x="710" y="206" class="field">BANK, STOCK, LOAN, PAY</text>

  <rect x="500" y="286" width="250" height="106" class="box codef"/>
  <text x="520" y="318" class="name">mock_codef_account</text>
  <text x="520" y="342" class="field">account_type</text>
  <text x="520" y="362" class="field">DEPOSIT, STOCK, LOAN, PAY_MONEY</text>

  <rect x="170" y="470" width="235" height="86" class="box codef"/>
  <text x="190" y="502" class="name">mock_codef_transaction</text>
  <text x="190" y="526" class="field">account_id, amount, direction</text>

  <rect x="450" y="470" width="235" height="86" class="box codef"/>
  <text x="470" y="502" class="name">mock_codef_balance_snapshot</text>
  <text x="470" y="526" class="field">balance, valuation_amount</text>

  <rect x="720" y="450" width="205" height="76" class="box asset"/>
  <text x="740" y="482" class="name">mock_codef_stock_holding</text>
  <text x="740" y="506" class="field">holdings, valuation</text>

  <rect x="720" y="548" width="205" height="76" class="box asset"/>
  <text x="740" y="580" class="name">mock_codef_loan</text>
  <text x="740" y="604" class="field">loan balance, rate</text>

  <rect x="720" y="646" width="205" height="76" class="box asset"/>
  <text x="740" y="678" class="name">mock_codef_pay_money</text>
  <text x="740" y="702" class="field">wallet balance, points</text>

  <rect x="970" y="130" width="190" height="86" class="box fixture"/>
  <text x="990" y="162" class="name">mock_scenario</text>
  <text x="990" y="186" class="field">NORMAL, EMPTY, ERROR</text>

  <rect x="970" y="286" width="190" height="86" class="box fixture"/>
  <text x="990" y="318" class="name">mock_api_endpoint</text>
  <text x="990" y="342" class="field">method, path</text>

  <rect x="970" y="450" width="190" height="86" class="box fixture"/>
  <text x="990" y="482" class="name">mock_api_response_fixture</text>
  <text x="990" y="506" class="field">request_match, response_json</text>

  <rect x="970" y="610" width="190" height="86" class="box fixture"/>
  <text x="990" y="642" class="name">mock_api_call_log</text>
  <text x="990" y="666" class="field">request, response, trace</text>

  <path class="rel" d="M270 173 C300 173 320 177 350 177"/>
  <text x="294" y="160" class="label">owns</text>
  <path class="rel" d="M590 177 C628 177 652 177 690 177"/>
  <text x="620" y="164" class="label">uses institution</text>
  <path class="rel" d="M470 224 C488 252 520 270 555 286"/>
  <path class="rel" d="M575 392 C510 430 390 452 312 470"/>
  <path class="rel" d="M625 392 C610 425 582 448 560 470"/>
  <path class="rel" d="M690 392 C742 418 784 432 820 450"/>
  <path class="rel" d="M690 392 C756 476 790 515 820 548"/>
  <path class="rel" d="M690 392 C768 535 797 610 820 646"/>
  <path class="rel" d="M1065 216 L1065 286"/>
  <path class="rel" d="M1065 372 L1065 450"/>
  <path class="rel" d="M1065 536 L1065 610"/>
</svg>
