# DB 접속 정보. 기본값은 로컬 개발 환경 기준이다.
# 컨테이너로 띄울 때는 아래 환경변수를 주면 그 값이 우선한다 (Monorepo 의 docker-compose.yml 참고).
#   JDBC_DRIVER / JDBC_URL / JDBC_USERNAME / JDBC_PASSWORD
# 환경변수가 없으면 콜론 뒤의 기본값이 쓰이므로 로컬 동작은 지금과 동일하다.
jdbc.driver=${JDBC_DRIVER:net.sf.log4jdbc.sql.jdbcapi.DriverSpy}
jdbc.url=${JDBC_URL:jdbc:log4jdbc:mysql://localhost:3306/financial_mock}
jdbc.username=${JDBC_USERNAME:root}
jdbc.password=${JDBC_PASSWORD:1234}
