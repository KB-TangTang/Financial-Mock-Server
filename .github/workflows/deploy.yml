name: EC2 백엔드 자동 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: EC2에 SSH 접속해서 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Financial-Mock-Server
            git pull origin main
            cd ~/Monorepo
            docker compose down
            docker compose up --build -d
            docker image prune -f
            sleep 15
            # `|| echo` 로 두면 배포가 깨져도 워크플로가 초록불로 끝난다.
            # 2026-08-06 목서버가 기동조차 못 하는 상태로 두 번 연속 success 로 보고돼
            # 전면 장애를 아무도 알아채지 못했다. 실패는 실패로 끝내고 로그를 남긴다.
            curl -f http://localhost:8080/api/health || (docker compose logs && exit 1)
